static_resources:
  listeners:
    - name: extension_listener
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: extension_grpc_web
                codec_type: AUTO
                internal_address_config: {}
                route_config:
                  name: runtime_route
                  virtual_hosts:
                    - name: local_runtime
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/privoke.v1.PrivokeRuntimeControlService/" }
                          route:
                            cluster: privoke_runtime_control
                            timeout: 35s
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match:
                                - exact: "http://localhost"
                                - exact: "http://127.0.0.1"
                                - safe_regex:
                                    regex: "^(chrome|moz|opera)-extension://[a-zA-Z0-9_@.{}-]+$"
                              allow_methods: "POST,OPTIONS"
                              allow_headers: "content-type,x-grpc-web,x-user-agent,grpc-timeout"
                              expose_headers: "grpc-status,grpc-message"
                              max_age: "86400"
                        - match: { prefix: "/privoke.v1.PrivokeRuntimeService/" }
                          route:
                            cluster: privoke_runtime
                            timeout: 30s
                          typed_per_filter_config:
                            envoy.filters.http.cors:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                              allow_origin_string_match:
                                - exact: "http://localhost"
                                - exact: "http://127.0.0.1"
                                - safe_regex:
                                    regex: "^(chrome|moz|opera)-extension://[a-zA-Z0-9_@.{}-]+$"
                              allow_methods: "POST,OPTIONS"
                              allow_headers: "content-type,x-grpc-web,x-user-agent,grpc-timeout"
                              expose_headers: "grpc-status,grpc-message"
                              max_age: "86400"
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: privoke_runtime_control
      connect_timeout: 1s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: privoke_runtime_control
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 50056
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
    - name: privoke_runtime
      connect_timeout: 1s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: privoke_runtime
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 50054
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
