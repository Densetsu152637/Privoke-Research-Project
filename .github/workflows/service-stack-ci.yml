name: Service stack CI

on:
  push:
    branches:
      - main
      - feat/dev-testing
      - feat/rust-rewrite
      - 'wt/**'
  pull_request:
    branches:
      - main
      - feat/dev-testing
  workflow_dispatch:
    inputs:
      allow_product_pipeline:
        description: Run separate full product/detector integration checks
        type: boolean
        default: false
  workflow_call:
    inputs:
      allow_product_pipeline:
        description: Run separate full product/deployment integration checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: service-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-tests:
    name: Browser extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # The extension tests rely on AbortSignal.timeout keeping the event loop alive, which Node 24 does and Node 22 does not.
          node-version: "24"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Test extension
        working-directory: extension
        run: npm test
      - name: Build unpacked extension
        working-directory: extension
        run: |
          npm run build
          npm run build:firefox

  model-tests:
    name: Model streaming Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/model-streaming-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache-dependency-path: services/model-streaming-service/go.sum
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Generate Go protobuf bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          mkdir -p gen
          protoc \
            --proto_path=../../shared/proto \
            --go_out=paths=source_relative:gen \
            --go-grpc_out=paths=source_relative:gen \
            ../../shared/proto/privoke/v1/parameters.proto
      - name: Test model service with race detection
        run: bash ../../evaluation/run-go-tests.sh

  supervisor-tests:
    name: Runtime supervisor tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension/runtime-supervisor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: extension/runtime-supervisor/requirements.txt
      - name: Install supervisor dependencies
        run: pip install -r requirements.txt
      - name: Generate supervisor protobuf bindings
        run: |
          mkdir -p generated
          python -m grpc_tools.protoc \
            -I ../../shared/proto \
            --python_out=generated \
            --grpc_python_out=generated \
            ../../shared/proto/privoke/v1/parameters.proto \
            ../../shared/proto/privoke/v1/runtime.proto
      - name: Generate the host gRPC clients the shared tests import
        run: python ../../evaluation/setup-host.py
      - name: Test runtime supervisor
        run: python ../../evaluation/run-component-tests.py supervisor
      - name: Test stack selection and credential loading
        run: python ../../evaluation/run-component-tests.py shared

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate development defaults and explicit production configuration
        run: python -m unittest discover -s evaluation/tests -p test_compose_defaults.py -v
      - name: Validate the Rust Compose files and deployment scripts
        env:
          IMAGE_PREFIX: australia-southeast1-docker.pkg.dev/example/privoke
          IMAGE_TAG: "0000000000000000000000000000000000000000"
          PRIVOKE_PKI_DIR: /tmp/privoke-ci-pki
          PRIVOKE_PKI_LIVE_DIR: /tmp/privoke-ci-pki-live
          MODEL_RELEASE_DIR: /tmp/privoke-ci-unmounted-releases
        run: |
          docker compose -f deploy/gce/compose.yml config --quiet
          COMPOSE_PROFILES=legacy-training docker compose -f deploy/gce/compose.yml config --quiet
          docker compose -f docker-compose.prod.yml --profile legacy-training config --quiet
          docker compose --profile legacy-training config --quiet
          docker compose -f docker-compose.prod.yml -f docker-compose.gpu.yml --profile legacy-training config --quiet
          docker compose -f docker-compose.legacy.yml config --quiet
          bash -n deploy/gce/bootstrap.sh deploy/gce/deploy.sh deploy/gce/pki-sync.sh
          shellcheck deploy/gce/bootstrap.sh deploy/gce/deploy.sh deploy/gce/pki-sync.sh
          python -m py_compile deploy/gce/tests/smoke.py
      - name: No reverse proxy remains in any deployment path
        run: |
          if git grep -n -i 'ngin[x]' -- deploy .github docker-compose.yml docker-compose.prod.yml docker-compose.gpu.yml; then
            echo 'A reverse proxy is referenced in a deployment path.' >&2
            exit 1
          fi
          test ! -e deploy/gce/ngin[x].conf
      - name: Test the revalidation check
        run: python -m unittest evaluation/tests/test_check_revalidation.py -v
      - name: Validate the stage 23 test helpers
        run: |
          python -m py_compile deploy/gce/tests/make_test_pki.py evaluation/update_security.py evaluation/update_security_report.py evaluation/check_revalidation.py
          PRIVOKE_W3_PKI_DIR=/tmp/privoke-ci-w3 PRIVOKE_PKI_DIR=/tmp/privoke-ci-pki             docker compose -f docker-compose.prod.yml -f docker-compose.analysis-test.yml --profile legacy-training config --quiet
          python -m py_compile rust/services/analysis/tests/test_container.py

  container-smoke:
    name: Rust container smoke test and update-security rows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUST_TOOLCHAIN: "1.99.1"
      CI_ROOT: /tmp/privoke-ci
      COMPOSE_PROJECT_NAME: privoke-rust-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: docker-compose.prod.yml
      COMPOSE_PROFILES: legacy-training
      PRIVOKE_PKI_DIR: /tmp/privoke-ci/pki
      # The images are named as smoke.py --images expects: <prefix>/<service>:<tag>.
      PRIVOKE_MODEL_STREAMING_IMAGE: ci/model-streaming-service:ci
      PRIVOKE_TELEMETRY_IMAGE: ci/telemetry-service:ci
      PRIVOKE_PARAM_UPDATE_IMAGE: ci/param-update-service:ci
      PRIVOKE_FUZZER_IMAGE: ci/privoke-fuzzer:ci
      PRIVOKE_ANALYSIS_IMAGE: ci/analysis-service:ci
      PRIVOKE_PYTHON_RUNTIME_IMAGE: privoke-client-runtime-base:ci
      # The standard V3 packages are ignored by Git and not available here, so the stack serves the tracked legacy catalogue
      # model. smoke.py --no-v3-package and update_security.py --no-v3 say so in their output; G8 is not covered in CI.
      MODEL_LATEST_ID: privoke-balanced
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the host test clients
        run: |
          pip install -r extension/runtime-supervisor/requirements.txt
          python evaluation/setup-host.py
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-pki-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Build privoke-pki and generate the throwaway test PKI
        run: |
          cargo build --release --locked -p privoke-pki --manifest-path rust/Cargo.toml
          umask 077
          python deploy/gce/tests/make_test_pki.py --tool rust/target/release/privoke-pki             --out "$PRIVOKE_PKI_DIR" --creds "$CI_ROOT/smoke-creds" --work "$CI_ROOT/pki-work"
          # The containers join group 10010 to read the key files; the files stay unreadable to everyone else.
          sudo chgrp -R 10010 "$PRIVOKE_PKI_DIR"
          sudo chmod -R g+rX,o-rwx "$PRIVOKE_PKI_DIR"
      - name: Build the images
        run: |
          docker build --pull --file extension/client-runtime/Dockerfile --target runtime --tag privoke-client-runtime-base:ci .
          docker compose build
      - name: Start the stack and wait for every health check
        run: |
          mkdir -p models/standard-releases
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 900
          docker compose ps --all
      - name: Smoke test, with the start-up refusal checks against the built images
        run: |
          python deploy/gce/tests/smoke.py --creds "$CI_ROOT/smoke-creds"             --model-target 127.0.0.1:50443 --telemetry-target 127.0.0.1:58443 --server-name localhost             --no-v3-package --images ci:ci --pki-dir "$PRIVOKE_PKI_DIR" --live-dir "$PRIVOKE_PKI_DIR/live"
      - name: Update-security negative rows against the Rust containers
        run: |
          mkdir -p "$CI_ROOT/out"
          python evaluation/update_security.py --target rust --rust-service all --no-v3             --rust-image "$PRIVOKE_MODEL_STREAMING_IMAGE" --rust-update-image "$PRIVOKE_PARAM_UPDATE_IMAGE"             --rust-telemetry-image "$PRIVOKE_TELEMETRY_IMAGE" --rust-analysis-image "$PRIVOKE_ANALYSIS_IMAGE"             --output "$CI_ROOT/out/update-security-rust.json"
      - name: Show the stack state and logs
        if: always()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --timestamps > "$CI_ROOT/out/compose.log" 2>&1 || true
          tail -n 200 "$CI_ROOT/out/compose.log" || true
      - name: Upload the update-security record and the stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-security-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/privoke-ci/out/update-security-rust.json
            /tmp/privoke-ci/out/compose.log
          if-no-files-found: warn
      - name: Stop the stack and remove the test PKI
        if: always()
        run: |
          docker compose down --volumes --remove-orphans --timeout 20
          sudo rm -rf "$CI_ROOT"

  semantic-training:
    name: Semantic-only automatic HEAD and FULL training
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: privoke-semantic-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: evaluation/compose.underlying-training-smoke.yml:evaluation/compose.semantic-ci.yml
      CI_STATE_ROOT: /tmp/privoke-semantic-training-${{ github.run_id }}-${{ github.run_attempt }}
      FT5_STATE_DIR: /tmp/privoke-semantic-training-${{ github.run_id }}-${{ github.run_attempt }}/positive
    steps:
      - uses: actions/checkout@v6
      - name: Prepare isolated state and semantic-only client command
        shell: bash
        run: |
          mkdir -p "$CI_STATE_ROOT"
          mkdir -p "$RUNNER_TEMP/semantic-diagnostics"
          sudo chown 10001:10001 "$CI_STATE_ROOT"
          cat > "$RUNNER_TEMP/semantic-smoke" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          docker compose run --rm --no-deps --user 10001:10001 \
            --entrypoint python \
            -v "${FT5_STATE_DIR}:/state" \
            -v "$GITHUB_WORKSPACE/models:/workspace/models:ro" \
            -e MODEL_STREAMING_TARGET=model-streaming-service:50051 \
            -e PARAM_UPDATE_TARGET=param-update-service:50052 \
            -e FUZZER_TARGET=privoke-fuzzer:50053 \
            -e PRIVOKE_RUNTIME_TARGET=client-runtime:50054 \
            client-runtime /workspace/evaluation/run-component-tests.py stack-smoke \
            --semantic-training-only --training-state-dir /state "$@" \
            2>&1 | tee -a "$RUNNER_TEMP/semantic-diagnostics/harness.log"
          SH
          chmod +x "$RUNNER_TEMP/semantic-smoke"
          docker compose config --quiet
      - name: Build current four-service CPU training images
        run: docker compose build --pull
      - name: Check installed CPU autograd dependency
        run: |
          FT5_STATE_DIR="$CI_STATE_ROOT" docker compose run --rm --no-deps \
            --user 10001:10001 --entrypoint python client-runtime -c \
            'import torch; assert torch.__version__.split("+")[0] == "2.11.0"; x=torch.tensor([1.0],requires_grad=True); (x*x).sum().backward(); assert x.grad.item()==2.0; print(torch.__version__)'
      - name: Prepare fixed fixture and capture S0 before automatic scheduling
        run: |
          FT5_STATE_DIR="$CI_STATE_ROOT" "$RUNNER_TEMP/semantic-smoke" \
            --training-action prepare --training-state-dir /state/positive \
            --training-source-revision "$GITHUB_SHA"
          docker compose up -d --wait --wait-timeout 180 model-streaming-service client-runtime
          "$RUNNER_TEMP/semantic-smoke" --training-action capture --training-output /state/captured-s0.json
      - name: Verify automatic semantic HEAD then FULL and publication guards
        run: |
          docker compose up -d --wait --wait-timeout 180
          for action in verify replay admission boundaries; do
            "$RUNNER_TEMP/semantic-smoke" --training-action "$action" \
              --training-wait-seconds 180 --training-output "/state/$action.json"
          done
      - name: Verify durable stage replay after all four services restart
        run: |
          docker compose restart
          docker compose up -d --wait --wait-timeout 180
          "$RUNNER_TEMP/semantic-smoke" --training-action restart --training-output /state/restart.json
      - name: Verify strict negative guard on a separate fresh fixture
        env:
          FT5_MIN_EXACT_MATCH_RATE: "1"
        run: |
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/semantic-diagnostics/positive-services.log"
          docker compose down --timeout 20
          export FT5_STATE_DIR="$CI_STATE_ROOT/negative"
          FT5_STATE_DIR="$CI_STATE_ROOT" "$RUNNER_TEMP/semantic-smoke" \
            --training-action prepare --training-state-dir /state/negative \
            --training-source-revision "$GITHUB_SHA"
          docker compose up -d --wait --wait-timeout 180 model-streaming-service client-runtime
          "$RUNNER_TEMP/semantic-smoke" --training-action capture --training-output /state/captured-s0.json
          docker compose up -d --wait --wait-timeout 180
          "$RUNNER_TEMP/semantic-smoke" --training-action negative \
            --training-wait-seconds 180 --training-output /state/negative.json
      - name: Retain state and service diagnostics, then stop this CI project
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/semantic-diagnostics"
          docker compose ps --all > "$RUNNER_TEMP/semantic-diagnostics/services.txt" 2>&1 || true
          docker compose logs --no-color --timestamps > "$RUNNER_TEMP/semantic-diagnostics/services.log" 2>&1 || true
          docker compose down --timeout 20
          sudo chown -R "$(id -u):$(id -g)" "$CI_STATE_ROOT"
      - name: Upload semantic-only requests, executions, receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-training-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_STATE_ROOT }}
            ${{ runner.temp }}/semantic-diagnostics
          if-no-files-found: warn

  docker-stack:
    name: Explicit legacy V1 product pipeline (retired Python and Go stack, oracle only)
    if: ${{ inputs.allow_product_pipeline == true }}
    needs:
      - extension-tests
      - model-tests
      - supervisor-tests
      - deployment-config
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: privoke-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: docker-compose.legacy.yml:evaluation/compose.localhost.yml:evaluation/compose.legacy-ci.yml
      COMPOSE_PROFILES: legacy-training
      FUZZER_PROMPT_COUNT: "0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Prepare host gRPC test clients
        run: |
          pip install -r extension/runtime-supervisor/requirements.txt
          python evaluation/setup-host.py

      - name: Validate the legacy Compose configuration
        run: docker compose config --quiet

      - name: Build every legacy microservice image
        run: docker compose build --pull

      - name: Run Python unit tests in the built service images
        run: |
          docker compose run --rm --no-deps --entrypoint python client-runtime \
            /workspace/evaluation/run-component-tests.py client-runtime
          docker compose run --rm --no-deps --entrypoint python param-update-service \
            /workspace/evaluation/run-component-tests.py param-update
          docker compose run --rm --no-deps --entrypoint python telemetry-service \
            /workspace/evaluation/run-component-tests.py telemetry
          docker compose run --rm --no-deps --entrypoint python privoke-fuzzer \
            /workspace/evaluation/run-component-tests.py fuzzer

      - name: Start the production stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 240

      - name: Verify production container hardening
        run: |
          for service in model-streaming-service param-update-service telemetry-service client-runtime privoke-fuzzer; do
            container_id="$(docker compose ps -q "$service")"
            test -n "$container_id"
            docker inspect "$container_id" | jq -e '.[0] |
              .HostConfig.ReadonlyRootfs == true and
              (.HostConfig.CapDrop | index("ALL") != null) and
              (.HostConfig.SecurityOpt | index("no-new-privileges:true") != null) and
              (.Config.User != "" and .Config.User != "root" and .Config.User != "0") and
              (.HostConfig.PortBindings | to_entries | all(.value | all(.HostIp == "127.0.0.1")))' >/dev/null
          done

      - name: Exercise all live gRPC service paths
        run: python evaluation/run-component-tests.py stack-smoke --training-request-id ci-production-training

      - name: Verify durable training replay after service restart
        run: |
          docker compose restart param-update-service privoke-fuzzer
          docker compose up -d --wait --wait-timeout 120 param-update-service privoke-fuzzer
          python evaluation/run-component-tests.py stack-smoke \
            --training-request-id ci-production-training --replay-training

      - name: Verify recovery after a model-service restart
        run: |
          docker compose restart model-streaming-service
          docker compose up -d --wait --wait-timeout 120 model-streaming-service
          python evaluation/run-component-tests.py stack-smoke --skip-training

      - name: Stop the legacy stack
        run: docker compose down --remove-orphans --timeout 20

      - name: Show stack state and logs after a failure
        if: failure()
        run: |
          docker compose ps --all || true
          for container_id in $(docker compose ps --all -q); do
            docker inspect --format '{{.Name}} {{json .State.Health}}' "$container_id" || true
          done
          docker compose logs --no-color --timestamps || true

      - name: Stop the stack and remove CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 20
