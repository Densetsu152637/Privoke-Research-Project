name: Deploy Compute Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-compute-engine
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/service-stack-ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: model-streaming-service
            dockerfile: services/model-streaming-service/Dockerfile
          - service: param-update-service
            dockerfile: services/param-update-service/Dockerfile
          - service: telemetry-service
            dockerfile: services/telemetry-service/Dockerfile
          - service: privoke-fuzzer
            dockerfile: services/privoke-fuzzer/Dockerfile
          - service: client-runtime
            dockerfile: extension/client-runtime/Dockerfile
    env:
      IMAGE_PREFIX: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPOSITORY }}
      SERVICE: ${{ matrix.service }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate registry configuration
        shell: bash
        run: |
          [[ "$IMAGE_PREFIX" =~ ^[a-z0-9-]+-docker.pkg.dev/[a-z0-9-]+/[a-z0-9_-]+$ ]] || { echo 'Configure the production GitHub secrets listed in .env.example.' >&2; exit 1; }
      - name: Build release image
        run: docker build --pull --file "$DOCKERFILE" --tag "$IMAGE_PREFIX/$SERVICE:$GITHUB_SHA" .
      # Authenticate after the potentially long image build.
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          token_format: access_token
      - name: Publish commit-tagged image
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          printf '%s' "$ACCESS_TOKEN" | docker login --username oauth2accesstoken --password-stdin "${IMAGE_PREFIX%%/*}"
          docker push "$IMAGE_PREFIX/$SERVICE:$GITHUB_SHA"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_INSTANCE: ${{ secrets.GCP_INSTANCE }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      IMAGE_PREFIX: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPOSITORY }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Transfer deployment files and deploy through IAP
        shell: bash
        run: |
          [[ "$IMAGE_PREFIX" =~ ^[a-z0-9-]+-docker.pkg.dev/[a-z0-9-]+/[a-z0-9_-]+$ ]]
          [[ "$GCP_INSTANCE" =~ ^[a-z][a-z0-9-]+$ ]]
          [[ "$GCP_ZONE" =~ ^[a-z0-9-]+$ ]]
          tar -czf "privoke-$GITHUB_SHA.tar.gz" -C deploy/gce compose.yml nginx.conf deploy.sh
          gcloud compute scp "privoke-$GITHUB_SHA.tar.gz" "$GCP_INSTANCE:~/privoke-$GITHUB_SHA.tar.gz" \
            --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap --quiet
          gcloud compute ssh "$GCP_INSTANCE" --project="$GCP_PROJECT_ID" --zone="$GCP_ZONE" --tunnel-through-iap --quiet \
            --command="set -eu; mkdir -p ~/privoke-$GITHUB_SHA; tar -xzf ~/privoke-$GITHUB_SHA.tar.gz -C ~/privoke-$GITHUB_SHA; sudo bash ~/privoke-$GITHUB_SHA/deploy.sh '$GITHUB_SHA' '$IMAGE_PREFIX'"
