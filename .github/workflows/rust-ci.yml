name: Rust workspace CI

# Runs the Rust workspace checks on GitHub-hosted runners so that agents and
# developers do not run full cargo builds locally (see the CI-first rule).
on:
  pull_request:
    paths:
      - 'rust/**'
      - 'shared/proto/**'
      - 'tests/conformance/**'
      - '.github/workflows/rust-ci.yml'
  push:
    branches:
      - feat/rust-rewrite
      - 'wt/**'
      - 'fix/**'
    paths:
      - 'rust/**'
      - 'shared/proto/**'
      - 'tests/conformance/**'
      - '.github/workflows/rust-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.99.1'

jobs:
  lint:
    name: Rust format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-lint-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-test-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  embed-check:
    # The PyO3 spaCy worker needs a CPython 3.11 development install. The full
    # embed tests need the Linux bundle, which is still pending (stage 11), so
    # this job only proves the embed feature compiles and lints on Linux.
    name: spaCy worker embed build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-embed-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Clippy with embed
        run: |
          PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')" \
            cargo clippy -p privoke-spacy-worker --features embed --all-targets --locked -- -D warnings
