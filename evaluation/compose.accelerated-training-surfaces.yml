# Standalone isolated study: no production names, detector stack or auto requester.
services:
  storage-permissions:
    pull_policy: never
    image: ${AS_UPDATER_IMAGE:?immutable updater image}
    user: '0:0'
    entrypoint: [python, -c]
    command:
      - |
        import pathlib,shutil,os
        source=pathlib.Path('/seed'); target=pathlib.Path('/models')
        for p in source.glob('*.json'):
          q=target/p.name
          if q.exists():
            assert q.read_bytes()==p.read_bytes(), 'existing catalog differs from prepared base'
          else: shutil.copyfile(p,q)
        for root in ('/models','/updates','/fuzzer'):
          os.chmod(root,0o777)
        for p in target.glob('*.json'): os.chmod(p,0o666)
    volumes:
      - ${AS_CATALOG:?prepared catalog}:/seed:ro
      # Only the prepared seed may initialize this volume. Consumers can be
      # created before init, and their images include release catalogs.
      - type: volume
        source: model-data
        target: /models
        volume: {nocopy: true}
      - update-data:/updates
      - fuzzer-data:/fuzzer
    restart: 'no'
  model-streaming-service:
    pull_policy: never
    image: ${AS_MODEL_IMAGE:?immutable model image}
    environment: {MODEL_STREAMING_PORT: '50051', MODEL_LATEST_ID: '${AS_MODEL_ID}', MODEL_ARTIFACT_DIR: /models}
    ports: ['127.0.0.1:${AS_MODEL_PORT}:50051']
    volumes:
      - type: volume
        source: model-data
        target: /models
        read_only: true
        volume: {nocopy: true}
    depends_on: {storage-permissions: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD, /model-streaming-service, healthcheck], interval: 2s, timeout: 2s, retries: 45}
  client-runtime:
    pull_policy: never
    image: ${AS_RUNTIME_IMAGE:?immutable training runtime image}
    working_dir: /workspace/extension/client-runtime
    environment:
      PRIVOKE_ENV_FILE: /dev/null
      PRIVOKE_STACK_MODE: internal
      PRIVOKE_LLM_CHOICE: streamed
      MODEL_STREAMING_TARGET: model-streaming-service:50051
      MODEL_STREAMING_CACHE_TTL_SECONDS: '1'
      MODEL_ID: ${AS_MODEL_ID}
      PRIVOKE_MODEL_DEVICE: cpu
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TELEMETRY_ENABLED: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    entrypoint: [python, -c]
    command:
      - |
        import signal,threading
        from src.hosting.grpc_server import create_grpc_server
        server=create_grpc_server(telemetry_reporter=None)
        assert server.add_insecure_port('0.0.0.0:50054')
        stopped=threading.Event()
        signal.signal(signal.SIGTERM,lambda *_: stopped.set())
        server.start()
        try: stopped.wait()
        finally: server.stop(5).wait()
    ports: ['127.0.0.1:${AS_RUNTIME_PORT}:50054']
    volumes: [runtime-state:/var/lib/privoke]
    depends_on: {model-streaming-service: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, /workspace/shared/python/grpc_healthcheck.py, client-runtime, '127.0.0.1:50054', /workspace/extension/client-runtime/generated], interval: 2s, timeout: 2s, retries: 45}
  param-update-service:
    pull_policy: never
    image: ${AS_UPDATER_IMAGE:?immutable updater image}
    environment:
      PARAM_UPDATE_PORT: '50052'
      PARAM_UPDATE_STORAGE_PATH: /data/updates.jsonl
      MODEL_ARTIFACT_PATH: /models/${AS_MODEL_ID}.json
      MODEL_ID: ${AS_MODEL_ID}
      FUZZER_PROMPT_COUNT: '0'
    ports: ['127.0.0.1:${AS_UPDATER_PORT}:50052']
    volumes:
      - type: volume
        source: model-data
        target: /models
        volume: {nocopy: true}
      - update-data:/data
    depends_on: {storage-permissions: {condition: service_completed_successfully}, model-streaming-service: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, /workspace/shared/python/grpc_healthcheck.py, param-update-service, '127.0.0.1:50052', /workspace/services/param-update-service/generated], interval: 2s, timeout: 2s, retries: 45}
  privoke-fuzzer:
    pull_policy: never
    image: ${AS_FUZZER_IMAGE:?immutable fuzzer image}
    environment:
      FUZZER_PORT: '50053'
      PARAM_UPDATE_TARGET: param-update-service:50052
      PRIVOKE_RUNTIME_TARGET: client-runtime:50054
      PRIVOKE_FUZZER_DUMP_DIR: /data
      FUZZ_CURRICULUM_STATE_PATH: /data/allocations.sqlite3
      FUZZ_MAX_CONCURRENT_CYCLES: '1'
      FUZZ_TIMEOUT_SECONDS: '300'
      FUZZ_MAX_PROMPT_COUNT: '256'
    ports: ['127.0.0.1:${AS_FUZZER_PORT}:50053']
    volumes: [fuzzer-data:/data]
    depends_on: {client-runtime: {condition: service_healthy}, param-update-service: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, /workspace/shared/python/grpc_healthcheck.py, privoke-fuzzer, '127.0.0.1:50053', /workspace/services/privoke-fuzzer/generated], interval: 2s, timeout: 2s, retries: 45}
volumes:
  model-data: {name: '${AS_PROJECT}-model-data'}
  update-data: {name: '${AS_PROJECT}-update-data'}
  fuzzer-data: {name: '${AS_PROJECT}-fuzzer-data'}
  runtime-state: {name: '${AS_PROJECT}-runtime-state'}
