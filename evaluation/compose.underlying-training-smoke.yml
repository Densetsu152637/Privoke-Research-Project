# Standalone task overlay: run with -p privoke-fuzzer-underlying-training-20261010.
# Does not inherit production container names, volumes, telemetry or detectors.
# FT5_STATE_DIR must be a freshly prepared absolute task directory.
name: privoke-fuzzer-underlying-training-20261010
x-security: &security
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,nosuid,nodev,size=128m"]
  restart: "no"
services:
  model-streaming-service:
    <<: *security
    build:
      context: ..
      dockerfile: services/model-streaming-service/Dockerfile
    image: privoke-fuzzer-underlying-training-20261010-model
    environment:
      MODEL_STREAMING_PORT: "50051"
      MODEL_LATEST_ID: privoke-balanced
      MODEL_ARTIFACT_DIR: /models
    ports: [127.0.0.1:52551:50051]
    volumes:
      - type: bind
        source: ${FT5_STATE_DIR:?Set absolute isolated task state directory}/catalog
        target: /models
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, /model-streaming-service, healthcheck]
      interval: 2s
      timeout: 2s
      retries: 30
  client-runtime:
    <<: *security
    build:
      context: ..
      dockerfile: extension/client-runtime/Dockerfile
      target: development
      args: {PRIVOKE_INSTALL_TRAINING_CPU: "true", PRIVOKE_INSTALL_GPU: "false"}
    image: privoke-fuzzer-underlying-training-20261010-runtime
    working_dir: /workspace/extension/client-runtime
    environment:
      PRIVOKE_ENV_FILE: /dev/null
      PRIVOKE_STACK_MODE: internal
      PRIVOKE_LLM_CHOICE: streamed
      MODEL_STREAMING_TARGET: model-streaming-service:50051
      MODEL_STREAMING_CACHE_TTL_SECONDS: "1"
      MODEL_ID: privoke-balanced
      PRIVOKE_MODEL_DEVICE: cpu
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TELEMETRY_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    ports: [127.0.0.1:52554:50054]
    depends_on:
      model-streaming-service: {condition: service_healthy}
    # Direct server construction never instantiates the product regex/NER stack.
    entrypoint: [python, -c]
    command:
      - |
        import signal, threading
        from src.hosting.grpc_server import create_grpc_server
        server = create_grpc_server(telemetry_reporter=None)
        assert server.add_insecure_port('0.0.0.0:50054')
        stopped = threading.Event()
        signal.signal(signal.SIGTERM, lambda *_: stopped.set())
        server.start()
        try: stopped.wait()
        finally: server.stop(5).wait()
    healthcheck:
      test: [CMD, python, /workspace/shared/python/grpc_healthcheck.py, client-runtime, 127.0.0.1:50054, /workspace/extension/client-runtime/generated]
      interval: 2s
      timeout: 2s
      retries: 30
  privoke-fuzzer:
    <<: *security
    build:
      context: ..
      dockerfile: services/privoke-fuzzer/Dockerfile
    image: privoke-fuzzer-underlying-training-20261010-fuzzer
    environment:
      FUZZER_PORT: "50053"
      FUZZER_ID: ft5-fuzzer
      MODEL_ID: privoke-balanced
      PARAM_UPDATE_TARGET: param-update-service:50052
      PRIVOKE_RUNTIME_TARGET: client-runtime:50054
      PRIVOKE_FUZZER_DUMP_DIR: /state/fuzzer
      FUZZ_PROMPT_DATASET_PATH: /state/prompts.json
      FUZZ_MAX_CONCURRENT_CYCLES: "1"
      FUZZ_MAX_PROMPT_COUNT: "8"
      FUZZ_HELDOUT_PROMPT_COUNT: "4"
      FUZZ_TRAINING_TRANSFORMS_PER_EXAMPLE: "0"
      FUZZ_TRAINING_LEARNING_RATE: "0.003"
      FUZZ_TRAINING_MAX_GRADIENT: "0.00001"
      FUZZ_MIN_EXACT_MATCH_RATE: ${FT5_MIN_EXACT_MATCH_RATE:-0}
      FUZZ_TIMEOUT_SECONDS: "120"
    ports: [127.0.0.1:52553:50053]
    volumes:
      - type: bind
        source: ${FT5_STATE_DIR:?Set absolute isolated task state directory}
        target: /state
        bind: {create_host_path: false}
    depends_on:
      client-runtime: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, /workspace/shared/python/grpc_healthcheck.py, privoke-fuzzer, 127.0.0.1:50053, /workspace/services/privoke-fuzzer/generated]
      interval: 2s
      timeout: 2s
      retries: 30
  param-update-service:
    <<: *security
    build:
      context: ..
      dockerfile: services/param-update-service/Dockerfile
    image: privoke-fuzzer-underlying-training-20261010-updater
    environment:
      PARAM_UPDATE_PORT: "50052"
      PARAM_UPDATE_SOURCE_ID: ft5-auto
      PARAM_UPDATE_STORAGE_PATH: /state/updates/updates.jsonl
      MODEL_ARTIFACT_PATH: /state/catalog/privoke-balanced.json
      MODEL_ID: privoke-balanced
      FUZZER_TARGET: privoke-fuzzer:50053
      FUZZER_PROMPT_COUNT: "8"
      FUZZER_TRAIN_UNDERLYING: "true"
      FUZZER_CYCLE_STATE_PATH: /state/updates/training-cycles.sqlite3
      FUZZER_REQUEST_INTERVAL_SECONDS: "0"
      FUZZER_REQUEST_INITIAL_DELAY_SECONDS: "0"
      FUZZER_REQUEST_TIMEOUT_SECONDS: "180"
      FUZZER_REQUEST_MAX_ATTEMPTS: "1"
      FUZZER_REQUEST_SEED: "1"
    ports: [127.0.0.1:52552:50052]
    volumes:
      - type: bind
        source: ${FT5_STATE_DIR:?Set absolute isolated task state directory}
        target: /state
        bind: {create_host_path: false}
    depends_on:
      model-streaming-service: {condition: service_healthy}
      privoke-fuzzer: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, /workspace/shared/python/grpc_healthcheck.py, param-update-service, 127.0.0.1:50052, /workspace/services/param-update-service/generated]
      interval: 2s
      timeout: 2s
      retries: 30
