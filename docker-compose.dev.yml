services:
  model-streaming-service:
    restart: "no"
    image: ${COMPOSE_PROJECT_NAME:-privoke-research-project}-model-streaming-service-dev
    build:
      context: .
      dockerfile: services/model-streaming-service/Dockerfile
      target: development
    container_name: model-streaming-service
    user: "0:0"
    read_only: false
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      MODEL_STREAMING_PORT: 50051
      MODEL_LATEST_ID: privoke-balanced
      MODEL_ARTIFACT_DIR: /models
      GOTMPDIR: /workspace/.tmp/go-build
    healthcheck:
      test: ["CMD", "/usr/local/bin/model-streaming-service-dev", "healthcheck"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 5s
    volumes:
      - ./services/model-streaming-service:/workspace/services/model-streaming-service
      - ./shared:/workspace/shared
      - ./models:/models:ro
    command:
      [
        "sh",
        "-c",
        "mkdir -p /workspace/.tmp/go-build /workspace/services/model-streaming-service/gen && protoc --proto_path=/workspace/shared/proto --go_out=paths=source_relative:/workspace/services/model-streaming-service/gen --go-grpc_out=paths=source_relative:/workspace/services/model-streaming-service/gen /workspace/shared/proto/privoke/v1/parameters.proto && go run ./cmd/server",
      ]

  param-update-service:
    restart: "no"
    image: ${COMPOSE_PROJECT_NAME:-privoke-research-project}-param-update-service-dev
    build:
      context: .
      dockerfile: services/param-update-service/Dockerfile
      target: development
    container_name: param-update-service
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
    read_only: false
    depends_on:
      model-streaming-service:
        condition: service_healthy
      privoke-fuzzer:
        condition: service_healthy
    ports:
      - "127.0.0.1:50052:50052"
    environment:
      PARAM_UPDATE_PORT: 50052
      PARAM_UPDATE_STORAGE_PATH: /data/updates.jsonl
      MODEL_ARTIFACT_PATH: /models/privoke-balanced.json
      FUZZER_TARGET: privoke-fuzzer:50053
      FUZZER_PROMPT_COUNT: ${FUZZER_PROMPT_COUNT:-0}
      FUZZER_REQUEST_TIMEOUT_SECONDS: 60
      FUZZER_REQUEST_MAX_ATTEMPTS: 5
      FUZZER_REQUEST_INTERVAL_SECONDS: 0
      MODEL_ID: privoke-balanced
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/workspace/shared/python/grpc_healthcheck.py",
          "param-update-service",
          "127.0.0.1:50052",
          "/workspace/services/param-update-service/generated",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    volumes:
      - param-update-data:/data
      - ./services/param-update-service:/workspace/services/param-update-service
      - ./shared:/workspace/shared
      - ./models:/models
    command:
      [
        "sh",
        "-c",
        "mkdir -p /workspace/services/param-update-service/generated && python -m grpc_tools.protoc -I /workspace/shared/proto --python_out=/workspace/services/param-update-service/generated --grpc_python_out=/workspace/services/param-update-service/generated /workspace/shared/proto/privoke/v1/parameters.proto && python app/server.py",
      ]

  telemetry-service:
    restart: "no"
    image: ${COMPOSE_PROJECT_NAME:-privoke-research-project}-telemetry-service-dev
    build:
      context: .
      dockerfile: services/telemetry-service/Dockerfile
      target: development
    container_name: telemetry-service
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
    read_only: false
    ports:
      - "127.0.0.1:50055:50055"
    environment:
      TELEMETRY_PORT: 50055
      TELEMETRY_DB_PATH: /data/telemetry.db
    volumes:
      - telemetry-data:/data
      - ./services/telemetry-service:/workspace/services/telemetry-service
      - ./shared:/workspace/shared
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/workspace/shared/python/grpc_healthcheck.py",
          "telemetry-service",
          "127.0.0.1:50055",
          "/workspace/services/telemetry-service/generated",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    command:
      [
        "sh",
        "-c",
        "mkdir -p /workspace/services/telemetry-service/generated && python -m grpc_tools.protoc -I /workspace/shared/proto --python_out=/workspace/services/telemetry-service/generated --grpc_python_out=/workspace/services/telemetry-service/generated /workspace/shared/proto/privoke/v1/telemetry.proto && python app/server.py",
      ]

  client-runtime:
    restart: "no"
    image: ${COMPOSE_PROJECT_NAME:-privoke-research-project}-client-runtime-dev
    build:
      context: .
      dockerfile: extension/client-runtime/Dockerfile
      target: development
    user: "0:0"
    read_only: false
    depends_on:
      model-streaming-service:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:50054:50054"
    environment:
      PRIVOKE_GRPC_PORT: 50054
      PRIVOKE_GRPC_HOST: "[::]"
      PRIVOKE_LLM_CHOICE: streamed
      MODEL_STREAMING_TARGET: model-streaming-service:50051
      MODEL_STREAMING_CONSUMER_ID: server-client-runtime
      MODEL_STREAMING_CACHE_TTL_SECONDS: ${MODEL_STREAMING_CACHE_TTL_SECONDS:-1}
      MODEL_ID: latest
      PRIVOKE_MODEL_DEVICE: ${PRIVOKE_MODEL_DEVICE:-auto}
      PYTHONPATH: /workspace/shared/python
      TELEMETRY_ENABLED: "true"
      TELEMETRY_TARGET: telemetry-service:50055
      TELEMETRY_SOURCE_ID: server-client-runtime
    volumes:
      - ./extension/client-runtime:/workspace/extension/client-runtime
      - ./shared:/workspace/shared
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/workspace/shared/python/grpc_healthcheck.py",
          "client-runtime",
          "127.0.0.1:50054",
          "/workspace/extension/client-runtime/generated",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    command:
      [
        "sh",
        "-c",
        "mkdir -p /workspace/extension/client-runtime/generated && python -m grpc_tools.protoc -I /workspace/shared/proto --python_out=/workspace/extension/client-runtime/generated --grpc_python_out=/workspace/extension/client-runtime/generated /workspace/shared/proto/privoke/v1/parameters.proto /workspace/shared/proto/privoke/v1/runtime.proto /workspace/shared/proto/privoke/v1/telemetry.proto && python src/grpc_main.py",
      ]

  privoke-fuzzer:
    restart: "no"
    image: ${COMPOSE_PROJECT_NAME:-privoke-research-project}-privoke-fuzzer-dev
    build:
      context: .
      dockerfile: services/privoke-fuzzer/Dockerfile
      target: development
    container_name: privoke-fuzzer
    user: "0:0"
    read_only: false
    depends_on:
      model-streaming-service:
        condition: service_healthy
      client-runtime:
        condition: service_healthy
    environment:
      MODEL_STREAMING_TARGET: model-streaming-service:50051
      PRIVOKE_RUNTIME_TARGET: client-runtime:50054
      PYTHONPATH: /workspace/shared/python
      PARAM_UPDATE_TARGET: param-update-service:50052
      MODEL_ID: privoke-balanced
      FUZZER_PORT: 50053
      FUZZER_ID: server-fuzzer
      PRIVOKE_FUZZER_DUMP_DIR: /workspace/dumps/privoke-fuzzer
      MODEL_STREAMING_FETCH_MAX_ATTEMPTS: 5
      MODEL_STREAMING_CONNECT_TIMEOUT_SECONDS: 2
      MODEL_STREAMING_RETRY_INITIAL_SECONDS: 1
      MODEL_STREAMING_RETRY_MAX_SECONDS: 4
      FUZZ_MAX_CONCURRENT_CYCLES: 1
      FUZZ_TRAINING_RUNTIME_MAX_IN_FLIGHT: ${FUZZ_TRAINING_RUNTIME_MAX_IN_FLIGHT:-8}
    volumes:
      - ./services/privoke-fuzzer:/workspace/services/privoke-fuzzer
      - ./shared:/workspace/shared
      - ./dumps/privoke-fuzzer:/workspace/dumps/privoke-fuzzer
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/workspace/shared/python/grpc_healthcheck.py",
          "privoke-fuzzer",
          "127.0.0.1:50053",
          "/workspace/services/privoke-fuzzer/generated",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    command:
      [
        "sh",
        "-c",
        "mkdir -p /workspace/services/privoke-fuzzer/generated && python -m grpc_tools.protoc -I /workspace/shared/proto --python_out=/workspace/services/privoke-fuzzer/generated --grpc_python_out=/workspace/services/privoke-fuzzer/generated /workspace/shared/proto/privoke/v1/parameters.proto /workspace/shared/proto/privoke/v1/runtime.proto && python src/main.py",
      ]

volumes:
  param-update-data:
  telemetry-data:
  fuzzer-dumps:
