user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1m;
    limit_conn_zone $binary_remote_addr zone=clients:10m;
    limit_req_zone $binary_remote_addr zone=requests:10m rate=20r/s;

    server {
        listen 127.0.0.1:8081;
        location = /healthz { return 200 "ok\n"; }
    }
    server {
        listen 443 ssl;
        http2 on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /run/secrets/server.crt;
        ssl_certificate_key /run/secrets/server.key;
        ssl_client_certificate /run/secrets/client-ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;
        limit_conn clients 20;
        limit_req zone=requests burst=40 nodelay;
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
        # Resolve service addresses again after Compose recreates containers.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $model_service model-streaming-service:50051;
        set $telemetry_service telemetry-service:50055;
        location = /privoke.v1.ModelStreamingService/Health {
            grpc_pass grpc://$model_service;
        }
        location = /privoke.v1.ModelStreamingService/StreamModelParameters {
            grpc_pass grpc://$model_service;
        }
        location = /privoke.v1.TelemetryService/RecordTelemetry {
            grpc_pass grpc://$telemetry_service;
        }
        location / { return 404; }
    }
}
