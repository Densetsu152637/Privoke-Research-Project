name: privoke

x-security: &security
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  storage-permissions:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/param-update-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: "no"
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        if [ ! -f /state/models/.initialized ]; then
          cp -a /models/. /state/models/
          touch /state/models/.initialized
        fi
        chown -R 10001:10001 /state/models /state/parameter-updates /state/telemetry /state/fuzzer-dumps
    volumes:
      - model-data:/state/models
      - param-update-data:/state/parameter-updates
      - telemetry-data:/state/telemetry
      - fuzzer-dumps:/state/fuzzer-dumps

  model-streaming-service:
    <<: *security
    image: ${IMAGE_PREFIX}/model-streaming-service:${IMAGE_TAG}
    depends_on:
      storage-permissions: {condition: service_completed_successfully}
    environment:
      MODEL_STREAMING_PORT: 50051
      MODEL_LATEST_ID: privoke-balanced
      MODEL_ARTIFACT_DIR: /models
    volumes: [model-data:/models:ro]
    healthcheck:
      test: [CMD, /model-streaming-service, healthcheck]
      interval: 5s
      timeout: 2s
      retries: 30

  telemetry-service:
    <<: *security
    image: ${IMAGE_PREFIX}/telemetry-service:${IMAGE_TAG}
    depends_on:
      storage-permissions: {condition: service_completed_successfully}
    environment:
      TELEMETRY_PORT: 50055
      TELEMETRY_DB_PATH: /data/telemetry.db
    volumes: [telemetry-data:/data]
    healthcheck:
      test: [CMD, python, /workspace/shared/python/grpc_healthcheck.py, telemetry-service, "127.0.0.1:50055", /workspace/services/telemetry-service/generated]
      interval: 5s
      timeout: 3s
      retries: 30

  client-runtime:
    <<: *security
    image: ${IMAGE_PREFIX}/client-runtime:${IMAGE_TAG}
    depends_on:
      model-streaming-service: {condition: service_healthy}
      telemetry-service: {condition: service_healthy}
    environment:
      PRIVOKE_GRPC_HOST: "[::]"
      PRIVOKE_GRPC_PORT: 50054
      PRIVOKE_STACK_MODE: internal
      PRIVOKE_LLM_CHOICE: streamed
      PRIVOKE_MODEL_DEVICE: cpu
      MODEL_STREAMING_TARGET: model-streaming-service:50051
      MODEL_STREAMING_CONSUMER_ID: server-client-runtime
      MODEL_ID: latest
      TELEMETRY_ENABLED: "true"
      TELEMETRY_TARGET: telemetry-service:50055
      TELEMETRY_SOURCE_ID: server-client-runtime
      PYTHONPATH: /workspace/shared/python
    healthcheck:
      test: [CMD, python, /workspace/shared/python/grpc_healthcheck.py, client-runtime, "127.0.0.1:50054", /workspace/extension/client-runtime/generated]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  privoke-fuzzer:
    <<: *security
    image: ${IMAGE_PREFIX}/privoke-fuzzer:${IMAGE_TAG}
    depends_on:
      storage-permissions: {condition: service_completed_successfully}
      client-runtime: {condition: service_healthy}
    environment:
      PRIVOKE_RUNTIME_TARGET: client-runtime:50054
      PARAM_UPDATE_TARGET: param-update-service:50052
      MODEL_ID: privoke-balanced
      FUZZER_PORT: 50053
      FUZZER_ID: server-fuzzer
      FUZZ_MAX_CONCURRENT_CYCLES: 1
      PRIVOKE_FUZZER_DUMP_DIR: /workspace/dumps/privoke-fuzzer
      PYTHONPATH: /workspace/shared/python
    volumes: [fuzzer-dumps:/workspace/dumps/privoke-fuzzer]
    healthcheck:
      test: [CMD, python, /workspace/shared/python/grpc_healthcheck.py, privoke-fuzzer, "127.0.0.1:50053", /workspace/services/privoke-fuzzer/generated]
      interval: 5s
      timeout: 3s
      retries: 30

  param-update-service:
    <<: *security
    image: ${IMAGE_PREFIX}/param-update-service:${IMAGE_TAG}
    depends_on:
      storage-permissions: {condition: service_completed_successfully}
      model-streaming-service: {condition: service_healthy}
      privoke-fuzzer: {condition: service_healthy}
    environment:
      PARAM_UPDATE_PORT: 50052
      PARAM_UPDATE_STORAGE_PATH: /data/updates.jsonl
      MODEL_ARTIFACT_PATH: /models/privoke-balanced.json
      FUZZER_TARGET: privoke-fuzzer:50053
      FUZZER_PROMPT_COUNT: ${FUZZER_PROMPT_COUNT:-0}
      FUZZER_REQUEST_TIMEOUT_SECONDS: 60
      FUZZER_REQUEST_MAX_ATTEMPTS: 5
      FUZZER_REQUEST_INTERVAL_SECONDS: 0
      MODEL_ID: privoke-balanced
    volumes: [param-update-data:/data, model-data:/models]
    healthcheck:
      test: [CMD, python, /workspace/shared/python/grpc_healthcheck.py, param-update-service, "127.0.0.1:50052", /workspace/services/param-update-service/generated]
      interval: 5s
      timeout: 3s
      retries: 30

  ingress:
    <<: *security
    image: nginx:1.28-alpine
    user: "0:0"
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["443:443"]
    depends_on:
      model-streaming-service: {condition: service_healthy}
      telemetry-service: {condition: service_healthy}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${SECRETS_DIR:?Set SECRETS_DIR}:/run/secrets:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 2s
      retries: 12

volumes:
  model-data:
  param-update-data:
  telemetry-data:
  fuzzer-dumps:
