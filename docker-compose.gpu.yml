# Optional GPU overlay for the quarantined analysis service, the only server container that runs torch. Layer it over the
# production or default file:
#
#   docker build -f extension/client-runtime/Dockerfile --target runtime --build-arg PRIVOKE_INSTALL_GPU=true \
#       -t privoke-client-runtime-base:gpu .
#   PRIVOKE_PYTHON_RUNTIME_IMAGE=privoke-client-runtime-base:gpu \
#   docker compose -f docker-compose.prod.yml -f docker-compose.gpu.yml --profile legacy-training up -d --build
#
# Not validated: the stage W3 checks ran on CPU only, and the worker's socket sandbox and the GPU device are not tested
# together. The Rust model, telemetry and update services never use a GPU.
services:
  analysis-service:
    gpus: all
    environment:
      PRIVOKE_MODEL_DEVICE: cuda
