[package]
name = "privoke-rules"
description = "Regex rule layer (including ported Presidio recognisers) and canonical-text preprocessing, matching the Python client runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# `regex` runs every rule that has no look-around or back-reference; `fancy-regex` runs the rest
# (the reasons are listed by `Detector::fancy_report` and in docs/runtime/rust-workspace.md).
regex = "1"
fancy-regex = "0.20"
toml = "1"
thiserror = { workspace = true }

[dev-dependencies]
serde_json = "1"
base64 = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
