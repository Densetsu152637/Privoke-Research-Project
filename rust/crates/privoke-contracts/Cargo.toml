[package]
name = "privoke-contracts"
description = "Python-compatible canonical JSON, checksums, fingerprints and V3 manifest rules, plus proto re-exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
privoke-proto = { path = "../privoke-proto" }
sha2 = { workspace = true }
# The evidence validators (`validate_execution`) work on already parsed `serde_json` documents.
serde_json = "1"
# Ed25519 for the signed publication statement; already in the workspace through rustls.
ring = "0.17"
thiserror = { workspace = true }
# `pywire` writes protobuf map entries by hand around `prost`'s own encoding.
prost = { workspace = true }

[features]
# Deterministic publication keys for tests and fixtures. Never enabled by a client or a service build.
test-keys = []

[dev-dependencies]
base64 = { workspace = true }

[lints]
workspace = true
