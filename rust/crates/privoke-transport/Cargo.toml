[package]
name = "privoke-transport"
description = "In-service mutual TLS, authorisation, limits and hot reload for the PriVoke Rust servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Plaintext loopback listener for the workstation supervisor only. Never enable in a cloud build.
workstation-loopback = []
# Builds the listener probe used by the fail-closed startup tests.
probe = ["dep:tonic-health"]

[[bin]]
name = "privoke-listener-probe"
path = "src/bin/privoke-listener-probe.rs"
required-features = ["probe"]

[dependencies]
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
x509-parser = { workspace = true }
arc-swap = { workspace = true }
notify = { workspace = true }
governor = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
hyper-util = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
time = { version = "0.3", default-features = false, features = ["std", "parsing", "formatting"] }
tonic-health = { workspace = true, optional = true }

[dev-dependencies]
privoke-proto = { path = "../privoke-proto" }
privoke-transport = { path = ".", features = ["workstation-loopback", "probe"] }
tempfile = { workspace = true }
rcgen = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tonic-health = { workspace = true }

[lints]
workspace = true
