[package]
name = "privoke-telemetry"
description = "The PriVoke telemetry service: locally private report ingestion, aggregate SQLite storage and the debiased summary estimator, behind mutual TLS with the shared reporter credential"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "privoke_telemetry"
path = "src/lib.rs"

[[bin]]
name = "telemetry-service"
path = "src/main.rs"

[dependencies]
privoke-contracts = { path = "../../crates/privoke-contracts" }
privoke-transport = { path = "../../crates/privoke-transport" }
tonic = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
# SQLite is compiled in so the container needs no system library. It opens the databases the Python service wrote.
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
privoke-pki = { path = "../../tools/privoke-pki" }
tempfile = { workspace = true }
prost = { workspace = true }
serde_json = "1"
base64 = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
