[package]
name = "privoke-runtime-supervisor"
description = "Workstation runtime controller: native-messaging host that owns the sandboxed worker pool, model fetch and enrolment commands (stages 7 and W4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "privoke_supervisor"
path = "src/lib.rs"

[[bin]]
name = "privoke-supervisor"
path = "src/main.rs"

[[bin]]
name = "privoke-supervisor-test-worker"
path = "src/bin/test_worker.rs"
required-features = ["test-helpers"]

[features]
default = []
# Test-only helpers: the stand-in W1 worker and the worker-command override of `native-host`. Never enabled by a normal build.
test-helpers = []

[dependencies]
privoke-contracts = { path = "../../crates/privoke-contracts" }
# Plaintext loopback is only for the local development stack's model-streaming target and the fetch tests' in-process
# server. The controller itself opens no listener.
privoke-transport = { path = "../../crates/privoke-transport", features = ["workstation-loopback"] }
privoke-pki = { path = "../../tools/privoke-pki" }
privoke-worker-pool = { path = "../../crates/privoke-worker-pool" }
prost = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal"] }
tokio-stream = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
time = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
privoke-runtime-supervisor = { path = ".", features = ["test-helpers"] }
privoke-model-streaming = { path = "../model-streaming" }
tempfile = { workspace = true }
time = { workspace = true }
rcgen = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
