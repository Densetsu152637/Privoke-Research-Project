[package]
name = "privoke-pki"
description = "Operator and installation tooling for the PriVoke certificate profile: CA, signing, CRL, enrolment, renewal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "privoke_pki"
path = "src/lib.rs"

[[bin]]
name = "privoke-pki"
path = "src/main.rs"

[dependencies]
privoke-transport = { path = "../../crates/privoke-transport" }
privoke-contracts = { path = "../../crates/privoke-contracts" }
rcgen = { workspace = true, features = ["x509-parser"] }
x509-parser = { workspace = true }
rustls-pki-types = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
time = { version = "0.3", default-features = false, features = ["std", "parsing", "formatting"] }
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
rcgen = { workspace = true, features = ["x509-parser"] }
time = { version = "0.3", default-features = false, features = ["std", "parsing", "formatting"] }
tonic-health = { workspace = true }

[lints]
workspace = true
