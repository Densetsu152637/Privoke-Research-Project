[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privoke-client-runtime"
version = "0.1.0"
description = "PriVoke client-side privacy detection runtime"
requires-python = ">=3.11"

[tool.setuptools]
packages = [
    "privoke_client_runtime",
    "privoke_client_runtime.classification",
    "privoke_client_runtime.detection",
    "privoke_client_runtime.hosting",
    "privoke_client_runtime.LLM",
    "privoke_client_runtime.LLM.privoke",
    "privoke_client_runtime.NER",
    "privoke_client_runtime.regex",
    "privoke_client_runtime.telemetry",
]

[tool.setuptools.package-dir]
privoke_client_runtime = "src"
"privoke_client_runtime.classification" = "src/classification"
"privoke_client_runtime.detection" = "src/detection"
"privoke_client_runtime.hosting" = "src/hosting"
"privoke_client_runtime.LLM" = "src/LLM"
"privoke_client_runtime.LLM.privoke" = "src/LLM/privoke"
"privoke_client_runtime.NER" = "src/NER"
"privoke_client_runtime.regex" = "src/regex"
"privoke_client_runtime.telemetry" = "src/telemetry"

[tool.setuptools.package-data]
privoke_client_runtime = ["py.typed"]
