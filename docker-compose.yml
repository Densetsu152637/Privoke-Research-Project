x-service-security: &service-security
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

services:
  storage-permissions:
    restart: "no"
    build:
      context: .
      dockerfile: services/param-update-service/Dockerfile
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/usr/bin/chown"]
    command:
      - "-R"
      - "10001:10001"
      - /state/parameter-updates
      - /state/telemetry
      - /state/fuzzer-dumps
    volumes:
      - param-update-data:/state/parameter-updates
      - telemetry-data:/state/telemetry
      - fuzzer-dumps:/state/fuzzer-dumps

  model-streaming-service:
    <<: *service-security
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/model-streaming-service/Dockerfile
    container_name: model-streaming-service
    expose:
      - "50051"
    environment:
      MODEL_STREAMING_PORT: 50051
      MODEL_LATEST_ID: privoke-balanced
      MODEL_ARTIFACT_DIR: /models
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "/model-streaming-service", "healthcheck"]
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 5s

  param-update-service:
    <<: *service-security
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/param-update-service/Dockerfile
    container_name: param-update-service
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
      model-streaming-service:
        condition: service_healthy
      privoke-fuzzer:
        condition: service_healthy
    expose:
      - "50052"
    environment:
      PARAM_UPDATE_PORT: 50052
      PARAM_UPDATE_STORAGE_PATH: /data/updates.jsonl
      MODEL_ARTIFACT_PATH: /models/privoke-balanced.json
      FUZZER_TARGET: privoke-fuzzer:50053
      FUZZER_PROMPT_COUNT: ${FUZZER_PROMPT_COUNT:-0}
      FUZZER_REQUEST_TIMEOUT_SECONDS: 60
      FUZZER_REQUEST_MAX_ATTEMPTS: 5
      FUZZER_REQUEST_INTERVAL_SECONDS: 0
      MODEL_ID: privoke-balanced
    volumes:
      - param-update-data:/data
      - ./models:/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/workspace/shared/python/grpc_healthcheck.py",
          "param-update-service",
          "127.0.0.1:50052",
          "/workspace/services/param-update-service/generated",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  telemetry-service:
    <<: *service-security
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/telemetry-service/Dockerfile
    container_name: telemetry-service
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
    expose:
      - "50055"
    environment:
      TELEMETRY_PORT: 50055
      TELEMETRY_DB_PATH: /data/telemetry.db
    volumes:
      - telemetry-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/workspace/shared/python/grpc_healthcheck.py",
          "telemetry-service",
          "127.0.0.1:50055",
          "/workspace/services/telemetry-service/generated",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  client-runtime:
    <<: *service-security
    restart: unless-stopped
    build:
      context: .
      dockerfile: extension/client-runtime/Dockerfile
    container_name: client-runtime
    depends_on:
      model-streaming-service:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy
    expose:
      - "50054"
    environment:
      PRIVOKE_GRPC_PORT: 50054
      PRIVOKE_GRPC_HOST: "[::]"
      PRIVOKE_LLM_CHOICE: streamed
      PRIVOKE_STACK_MODE: internal
      PRIVOKE_REGEX_GITLEAKS: ${PRIVOKE_REGEX_GITLEAKS:-true}
      PRIVOKE_REGEX_PRESIDIO: ${PRIVOKE_REGEX_PRESIDIO:-true}
      MODEL_STREAMING_TARGET: model-streaming-service:50051
      MODEL_STREAMING_CONSUMER_ID: server-client-runtime
      MODEL_STREAMING_CACHE_TTL_SECONDS: ${MODEL_STREAMING_CACHE_TTL_SECONDS:-1}
      MODEL_ID: latest
      PRIVOKE_MODEL_DEVICE: ${PRIVOKE_MODEL_DEVICE:-auto}
      PYTHONPATH: /workspace/shared/python
      TELEMETRY_ENABLED: "true"
      TELEMETRY_TARGET: telemetry-service:50055
      TELEMETRY_SOURCE_ID: server-client-runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/workspace/shared/python/grpc_healthcheck.py",
          "client-runtime",
          "127.0.0.1:50054",
          "/workspace/extension/client-runtime/generated",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  privoke-fuzzer:
    <<: *service-security
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/privoke-fuzzer/Dockerfile
    container_name: privoke-fuzzer
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
      client-runtime:
        condition: service_healthy
    environment:
      PRIVOKE_RUNTIME_TARGET: client-runtime:50054
      PYTHONPATH: /workspace/shared/python
      PARAM_UPDATE_TARGET: param-update-service:50052
      MODEL_ID: privoke-balanced
      FUZZER_PORT: 50053
      FUZZER_ID: server-fuzzer
      PRIVOKE_FUZZER_DUMP_DIR: /workspace/dumps/privoke-fuzzer
      FUZZ_MAX_CONCURRENT_CYCLES: 1
    volumes:
      - fuzzer-dumps:/workspace/dumps/privoke-fuzzer
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/workspace/shared/python/grpc_healthcheck.py",
          "privoke-fuzzer",
          "127.0.0.1:50053",
          "/workspace/services/privoke-fuzzer/generated",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  param-update-data:
  telemetry-data:
  fuzzer-dumps:
