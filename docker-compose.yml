# Default host-test stack: the same Rust images as docker-compose.prod.yml (there is no separate development image), with
# the internal listeners also published on 127.0.0.1 so that host Python and Rust test clients can reach them, and with
# restart loops off. Every listener is still mutual TLS; there is no plaintext mode to switch on.
#
#   export PRIVOKE_PKI_DIR=<test certificate directory, laid out as in docker-compose.prod.yml>
#   docker compose up -d --build                         # model and telemetry
#   docker compose --profile legacy-training up -d       # plus the update service, fuzzer and quarantined analysis
#
# Production: docker compose -f docker-compose.prod.yml ...
# The analysis service sits on internal-only networks and is deliberately not published; see
# rust/services/analysis/tests/ for the gateway the stage W3 checks use.
services:
  model-seed:
    extends:
      file: docker-compose.prod.yml
      service: model-seed

  model-streaming-service:
    extends:
      file: docker-compose.prod.yml
      service: model-streaming-service
    restart: "no"
    ports:
      - "127.0.0.1:50051:50051"

  telemetry-service:
    extends:
      file: docker-compose.prod.yml
      service: telemetry-service
    restart: "no"
    ports:
      - "127.0.0.1:50055:50055"

  param-update-bootstrap:
    extends:
      file: docker-compose.prod.yml
      service: param-update-bootstrap

  param-update-service:
    extends:
      file: docker-compose.prod.yml
      service: param-update-service
    restart: "no"
    ports:
      - "127.0.0.1:50052:50052"

  privoke-fuzzer:
    extends:
      file: docker-compose.prod.yml
      service: privoke-fuzzer
    restart: "no"
    ports:
      - "127.0.0.1:50053:50053"

  analysis-model-streaming:
    extends:
      file: docker-compose.prod.yml
      service: analysis-model-streaming
    restart: "no"

  analysis-service:
    extends:
      file: docker-compose.prod.yml
      service: analysis-service
    restart: "no"

networks:
  analysis-fuzzer:
    internal: true
  analysis-models:
    internal: true

volumes:
  model-data:
  param-update-data:
  telemetry-data:
  fuzzer-dumps:
  analysis-model-cache:
