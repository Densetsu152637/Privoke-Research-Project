services:
  model-streaming-service:
    build:
      context: .
      dockerfile: services/model-streaming-service/Dockerfile
    container_name: model-streaming-service
    ports:
      - "50051:50051"
    environment:
      MODEL_STREAMING_PORT: 50051
      MODEL_ID: privoke-baseline
      MODEL_VERSION: v0.1.0

  param-update-service:
    build:
      context: .
      dockerfile: services/param-update-service/Dockerfile
    container_name: param-update-service
    depends_on:
      - privoke-fuzzer
    ports:
      - "50052:50052"
    environment:
      PARAM_UPDATE_PORT: 50052
      PARAM_UPDATE_STORAGE_PATH: /data/updates.jsonl
      FUZZER_TARGET: privoke-fuzzer:50053
      FUZZER_PROMPT_COUNT: 8
      FUZZER_REQUEST_INTERVAL_SECONDS: 0
      MODEL_ID: privoke-baseline
    volumes:
      - param-update-data:/data

  privoke-fuzzer:
    build:
      context: .
      dockerfile: services/privoke-fuzzer/Dockerfile
    container_name: privoke-fuzzer
    depends_on:
      - model-streaming-service
    environment:
      MODEL_STREAMING_TARGET: model-streaming-service:50051
      PARAM_UPDATE_TARGET: param-update-service:50052
      MODEL_ID: privoke-baseline
      FUZZER_PORT: 50053
      FUZZER_ID: server-fuzzer
      PRIVOKE_RUNTIME_URL: http://client-runtime:8765
      PRIVOKE_FUZZER_DUMP_DIR: /workspace/dumps/privoke-fuzzer

  client-runtime:
    build:
      context: .
      dockerfile: services/client-runtime/Dockerfile
    container_name: client-runtime
    depends_on:
      - model-streaming-service
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      MODEL_STREAMING_TARGET: model-streaming-service:50051
      MODEL_ID: privoke-baseline
      PRIVOKE_ALLOW_NON_LOOPBACK_BIND: "true"
      PRIVOKE_HOST: 0.0.0.0
      PRIVOKE_PORT: 8765
      PRIVOKE_LLM_CHOICE: streamed
      LM_STUDIO_BASE_URL: http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "python",
        "src/main.py",
        "--host",
        "0.0.0.0",
        "--port",
        "8765",
        "--llm-choice",
        "streamed",
      ]

volumes:
  param-update-data:
