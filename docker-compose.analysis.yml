# Quarantined analysis service for the fuzzer (stage W3 of docs/plans/rust-server-rewrite.md).
#
# Additive: it changes nothing in docker-compose.prod.yml or docker-compose.yml. Layer it over the production file and
# select both profiles (the fuzzer belongs to `legacy-training`):
#
#   export PRIVOKE_W3_PKI_DIR=<directory of server, service and CA files, see docs/runtime/rust-workspace.md>
#   docker compose -f docker-compose.prod.yml -f docker-compose.analysis.yml \
#       --profile legacy-training --profile quarantined-analysis up -d
#
# What it adds:
#   analysis-model-streaming  the Rust model-streaming service (stage 3), on an internal network shared only with the
#                             analysis service. It serves the same `model-data` volume the param-update service writes.
#   analysis-service          the quarantined analysis service. No default network, so no route out: it sits on two
#                             `internal: true` networks, one shared with the fuzzer and one with model-streaming. Read-only
#                             root, a tmpfs for scratch, a non-root user, no capabilities, no-new-privileges, Docker's
#                             default seccomp profile, and memory, CPU and pids limits. The model cache is a named volume.
#   privoke-fuzzer            (overrides) its runtime target becomes the analysis service over mutual TLS, so it no longer
#                             needs the client-runtime or the Go model service.
#
# Every certificate and key is read from PRIVOKE_W3_PKI_DIR, which the operator or the test creates; none is committed.

x-analysis-pki: &pki
  type: bind
  source: ${PRIVOKE_W3_PKI_DIR:?set PRIVOKE_W3_PKI_DIR to the directory with the analysis certificates}
  target: /run/privoke
  read_only: true

services:
  analysis-model-streaming:
    profiles: [quarantined-analysis]
    image: ${PRIVOKE_MODEL_STREAMING_RUST_IMAGE:-privoke-model-streaming-rust:s03}
    build:
      context: .
      dockerfile: rust/services/model-streaming/Dockerfile
    container_name: analysis-model-streaming
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    restart: unless-stopped
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
    networks: [analysis-models]
    environment:
      MODEL_ARTIFACT_DIR: /models
      MODEL_LATEST_ID: privoke-balanced
      MODEL_RELEASE_DIR: /nonexistent
      MODEL_HEALTHCHECK_SERVER_CA: /run/privoke/server-ca.pem
      MODEL_HEALTHCHECK_CERT: /run/privoke/svc/analysis.crt
      MODEL_HEALTHCHECK_KEY: /run/privoke/svc/analysis.key
      MODEL_HEALTHCHECK_SERVER_NAME: analysis-model-streaming
    command:
      - --cert=/run/privoke/server/server.crt
      - --key=/run/privoke/server/server.key
      - --client-ca=/run/privoke/client-ca.pem
      - --crl=/run/privoke/crl.pem
      - --registry=/run/privoke/registry.toml
    volumes:
      - model-data:/models:ro
      - *pki
    healthcheck:
      test: ["CMD", "/model-streaming-service", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  analysis-service:
    profiles: [quarantined-analysis]
    image: ${PRIVOKE_ANALYSIS_IMAGE:-privoke-analysis:w3}
    build:
      context: .
      dockerfile: rust/services/analysis/Dockerfile
      args:
        PYTHON_RUNTIME_IMAGE: ${PRIVOKE_PYTHON_RUNTIME_IMAGE:-privoke-research-project-client-runtime:latest}
    container_name: analysis-service
    restart: unless-stopped
    # Quarantine. `internal: true` networks below give it no route to anything outside the two peers; the controls here
    # remove what a compromised worker could use inside the container. seccomp is left at Docker's default profile on
    # purpose (never `unconfined`).
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2.0
    pids_limit: 256
    depends_on:
      analysis-model-streaming:
        condition: service_healthy
    networks: [analysis-fuzzer, analysis-models]
    environment:
      ANALYSIS_PORT: 50054
      ANALYSIS_BIND: 0.0.0.0
      ANALYSIS_ALLOWED_SERVICES: fuzzer
      ANALYSIS_HEALTH_SERVICES: analysis
      MODEL_STREAMING_TARGET: analysis-model-streaming:50051
      ANALYSIS_MODEL_SERVER_NAME: analysis-model-streaming
      ANALYSIS_MODEL_SERVER_CA: /run/privoke/server-ca.pem
      ANALYSIS_MODEL_CLIENT_CERT: /run/privoke/svc/analysis.crt
      ANALYSIS_MODEL_CLIENT_KEY: /run/privoke/svc/analysis.key
      ANALYSIS_DEFAULT_MODEL_ID: privoke-balanced
      ANALYSIS_WARM_MODELS: privoke-balanced
      ANALYSIS_HEALTHCHECK_SERVER_CA: /run/privoke/server-ca.pem
      ANALYSIS_HEALTHCHECK_CERT: /run/privoke/svc/analysis.crt
      ANALYSIS_HEALTHCHECK_KEY: /run/privoke/svc/analysis.key
      ANALYSIS_HEALTHCHECK_SERVER_NAME: analysis-service
      HOME: /tmp
    command:
      - --cert=/run/privoke/server/server.crt
      - --key=/run/privoke/server/server.key
      - --client-ca=/run/privoke/client-ca.pem
      - --crl=/run/privoke/crl.pem
      - --registry=/run/privoke/registry.toml
    volumes:
      - analysis-model-cache:/var/cache/privoke-models
      - *pki
    healthcheck:
      test: ["CMD", "/usr/local/bin/analysis-service", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 120
      start_period: 30s

  # The fuzzer keeps its image and its other settings. Only the runtime target and the credentials change, and the
  # dependency on the plaintext client-runtime goes: the analysis service replaces it.
  privoke-fuzzer:
    depends_on:
      client-runtime: !reset null
      analysis-service:
        condition: service_healthy
    networks: [default, analysis-fuzzer]
    environment:
      PRIVOKE_RUNTIME_TARGET: analysis-service:50054
      PRIVOKE_TLS_CERT_FILE: /run/privoke/svc/fuzzer.crt
      PRIVOKE_TLS_KEY_FILE: /run/privoke/svc/fuzzer.key
      PRIVOKE_TLS_CA_FILE: /run/privoke/server-ca.pem
      PRIVOKE_SERVER_TLS_CERT_FILE: /run/privoke/server/server.crt
      PRIVOKE_SERVER_TLS_KEY_FILE: /run/privoke/server/server.key
      PRIVOKE_SERVER_TLS_CLIENT_CA_FILE: /run/privoke/client-ca.pem
      PRIVOKE_SERVER_REGISTRY_FILE: /run/privoke/registry.toml
      PRIVOKE_SERVER_ALLOWED_IDENTITIES: urn:privoke:service:fuzzer,urn:privoke:service:w3-driver
    volumes:
      - *pki

networks:
  analysis-fuzzer:
    internal: true
  analysis-models:
    internal: true

volumes:
  analysis-model-cache:
