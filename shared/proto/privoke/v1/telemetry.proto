syntax = "proto3";

package privoke.v1;

message TelemetryHealthRequest {}

message TelemetryHealthResponse {
  string service = 1;
  string status = 2;
}

// This contains only client-side randomized reports over fixed public domains.
// Legacy identifiers and raw measurements are intentionally absent.
message TelemetryPacket {
  reserved 1 to 19;
  string time_bucket = 20;
  string action = 21;
  string primary_category = 22;
  string risk_bucket = 23;
  string model_version = 24;
  string privacy_mechanism = 25;
  double privacy_epsilon = 26;
}

message RecordTelemetryResponse {
  bool accepted = 1;
  string message = 2;
}

message TelemetryCategoryEstimate {
  string value = 1;
  double estimated_count = 2;
  uint64 observed_noisy_count = 3;
}

message TelemetryDimensionEstimate {
  string dimension = 1;
  repeated TelemetryCategoryEstimate values = 2;
}

message GetTelemetrySummaryRequest {}

message GetTelemetrySummaryResponse {
  // Exact number of submitted reports. Report existence/count is not private.
  uint64 sample_count = 1;
  repeated TelemetryDimensionEstimate dimensions = 2;
}

service TelemetryService {
  rpc RecordTelemetry(TelemetryPacket) returns (RecordTelemetryResponse);
  rpc GetTelemetrySummary(GetTelemetrySummaryRequest) returns (GetTelemetrySummaryResponse);
  rpc Health(TelemetryHealthRequest) returns (TelemetryHealthResponse);
}
