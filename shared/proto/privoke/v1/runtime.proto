syntax = "proto3";

package privoke.v1;

message RuntimeHealthRequest {}

message RuntimeHealthResponse {
  string service = 1;
  string status = 2;
}

message SetRuntimeEnabledRequest {
  bool enabled = 1;
  optional bool use_local_stack = 2;
}

message RuntimeControlStatus {
  bool enabled = 1;
  string status = 2;
  string message = 3;
  uint32 process_id = 4;
}

enum DetectionLayer {
  DETECTION_LAYER_UNSPECIFIED = 0;
  DETECTION_LAYER_RUNTIME = 1;
  DETECTION_LAYER_REGEX = 2;
  DETECTION_LAYER_NER = 3;
  DETECTION_LAYER_SEMANTIC = 4;
}

enum RegexExecutionOrder {
  REGEX_EXECUTION_ORDER_DEFAULT = 0;
  REGEX_EXECUTION_ORDER_FIRST = 1;
  REGEX_EXECUTION_ORDER_PARALLEL = 2;
}

message AnalyzePromptRequest {
  string text = 1;
  string source = 2;
  string target_app = 3;
  string visibility_hint = 4;
  string request_id = 5;
  map<string, string> metadata = 6;
  repeated DetectionLayer layers = 7;
  RegexExecutionOrder regex_execution_order = 8;
  string semantic_model_id = 9;
}

message RuntimeLayerExecution {
  DetectionLayer layer = 1;
  string status = 2;
  repeated RuntimeDetectionResult results = 3;
  string error = 4;
}

message RuntimeClassification {
  string sensitivity = 1;
  string visibility = 2;
  repeated string categories = 3;
  uint32 packed = 4;
}

message RuntimeDetectionResult {
  RuntimeClassification classification = 1;
  string action = 2;
  string section_of_text = 3;
  int32 span_start = 4;
  int32 span_end = 5;
  bool has_span = 6;
  double confidence = 7;
  bool has_confidence = 8;
  string reasoning = 9;
  map<string, string> metadata = 10;
}

message AnalyzePromptResponse {
  string request_id = 1;
  string action = 2;
  bool allowed = 3;
  string masked_text = 4;
  RuntimeClassification classification = 5;
  string reason = 6;
  RuntimeDetectionResult evidence = 7;
  map<string, string> metadata = 8;
  reserved 9;
  repeated RuntimeLayerExecution layers = 10;
  double elapsed_ms = 11;
  string error = 12;
}

message RuntimeTrainingExample {
  string text = 1;
  RuntimeClassification target = 2;
  bool has_target = 3;
  double weight = 4;
}

message ComputeSemanticGradientsRequest {
  string request_id = 1;
  string model_id = 2;
  repeated RuntimeTrainingExample examples = 3;
  double learning_rate = 4;
  double max_gradient = 5;
}

message RuntimeParameterDelta {
  string name = 1;
  repeated float values = 2;
  repeated uint32 shape = 3;
}

message ComputeSemanticGradientsResponse {
  string request_id = 1;
  string model_id = 2;
  string base_version = 3;
  repeated RuntimeParameterDelta gradients = 4;
  map<string, double> metrics = 5;
  map<string, string> metadata = 6;
  string error = 7;
}

service PrivokeRuntimeService {
  rpc AnalyzePrompt(AnalyzePromptRequest) returns (AnalyzePromptResponse);
  rpc ComputeSemanticGradients(ComputeSemanticGradientsRequest) returns (ComputeSemanticGradientsResponse);
  rpc Health(RuntimeHealthRequest) returns (RuntimeHealthResponse);
}

service PrivokeRuntimeControlService {
  rpc SetRuntimeEnabled(SetRuntimeEnabledRequest) returns (RuntimeControlStatus);
  rpc Status(RuntimeHealthRequest) returns (RuntimeControlStatus);
  rpc ModelStreamingHealth(RuntimeHealthRequest) returns (RuntimeHealthResponse);
}
