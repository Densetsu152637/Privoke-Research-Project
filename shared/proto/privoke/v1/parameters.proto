syntax = "proto3";

package privoke.v1;

option go_package = "github.com/privoke/research-project/services/model-streaming-service/gen/privoke/v1;privokev1";

message HealthRequest {}

message HealthResponse {
  string service = 1;
  string status = 2;
}

message Parameter {
  string name = 1;
  repeated float values = 2;
  // Row-major tensor dimensions. Older scalar/vector consumers may ignore it.
  repeated uint32 shape = 3;
}

message ModelParametersRequest {
  string consumer_id = 1;
  string model_id = 2;
}

message ModelParametersResponse {
  string model_id = 1;
  string version = 2;
  int64 generated_at_unix = 3;
  repeated Parameter parameters = 4;
  map<string, string> metadata = 5;
}

message ParameterChunk {
  string name = 1;
  repeated uint32 shape = 2;
  uint32 value_offset = 3;
  repeated float values = 4;
}

message ModelParameterChunk {
  string model_id = 1;
  string version = 2;
  int64 generated_at_unix = 3;
  ParameterChunk parameter = 4;
  map<string, string> metadata = 5;
  uint32 chunk_index = 6;
  uint32 total_chunks = 7;
}

message ParameterUpdateRequest {
  string source_id = 1;
  string model_id = 2;
  string base_version = 3;
  repeated Parameter gradients = 4;
  map<string, string> metadata = 5;
}

message ParameterUpdateAck {
  bool accepted = 1;
  string model_id = 2;
  string applied_version = 3;
  string message = 4;
}

message FuzzerTrainingRequest {
  string request_id = 1;
  string source_id = 2;
  string model_id = 3;
  uint32 prompt_count = 4;
  uint32 seed = 5;
  map<string, string> metadata = 6;
}

message FuzzerTrainingResponse {
  bool accepted = 1;
  string model_id = 2;
  string base_version = 3;
  string applied_version = 4;
  uint32 prompts_generated = 5;
  string message = 6;
  map<string, string> metadata = 7;
}

service ModelStreamingService {
  rpc GetModelParameters(ModelParametersRequest) returns (ModelParametersResponse);
  rpc StreamModelParameters(ModelParametersRequest) returns (stream ModelParameterChunk);
  rpc Health(HealthRequest) returns (HealthResponse);
}

service ParamUpdateService {
  rpc SubmitParameterUpdate(ParameterUpdateRequest) returns (ParameterUpdateAck);
  rpc Health(HealthRequest) returns (HealthResponse);
}

service FuzzerService {
  rpc RunTrainingCycle(FuzzerTrainingRequest) returns (FuzzerTrainingResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
