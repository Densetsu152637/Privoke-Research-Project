# Test-only additions for the stage W3 and stage 5 checks (rust/services/analysis/tests/test_container.py). Never part of
# a deployment. Layer it over the production file, which already holds the analysis services (stage 8a moved them there):
#
#   export PRIVOKE_PKI_DIR=<directory laid out as described in docker-compose.prod.yml>
#   docker compose -f docker-compose.prod.yml -f docker-compose.analysis-test.yml --profile legacy-training up -d
#
# Two things differ from the production stack, and both are the test's to supply:
#
# * The host cannot reach a container whose only networks are `internal: true`. `analysis-test-gateway` copies TCP
#   bytes from three loopback ports to the analysis service, the fuzzer and the model service. TLS stays end to end between
#   the host client and the target, and the gateway holds no credential. The analysis service itself still has no route
#   out and no published port.
# * The fuzzer also admits the test driver, w3-driver. The parameter-update scheduler is off unless PRIVOKE_S5_PROMPT_COUNT is set, because the checks start their own
#   training cycles.
#
# The gateway script is plain Python from tests/support, mounted read-only into a stock interpreter image.

x-support: &support
  type: bind
  source: ./rust/services/analysis/tests/support
  target: /support
  read_only: true

services:
  analysis-test-gateway:
    profiles: [legacy-training]
    image: ${PRIVOKE_SUPPORT_IMAGE:-python:3.11-slim-bookworm}
    container_name: analysis-test-gateway
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    command: [python, /support/tcp_gateway.py, "50754=analysis-service:50054", "50753=privoke-fuzzer:50053", "50752=analysis-model-streaming:50051"]
    ports:
      - "127.0.0.1:${PRIVOKE_W3_ANALYSIS_PORT:-50754}:50754"
      - "127.0.0.1:${PRIVOKE_W3_FUZZER_PORT:-50753}:50753"
      - "127.0.0.1:${PRIVOKE_W3_MODEL_PORT:-50752}:50752"
    networks: [default, analysis-fuzzer, analysis-models]
    volumes:
      - *support

  param-update-service:
    environment:
      FUZZER_PROMPT_COUNT: ${PRIVOKE_S5_PROMPT_COUNT:-0}
      FUZZER_REQUEST_INTERVAL_SECONDS: "86400"

  # The test driver calls the fuzzer with its own service identity.
  privoke-fuzzer:
    environment:
      PRIVOKE_SERVER_ALLOWED_IDENTITIES: urn:privoke:service:param-update,urn:privoke:service:fuzzer,urn:privoke:service:w3-driver
