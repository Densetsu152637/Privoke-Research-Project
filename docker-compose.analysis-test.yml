# Test-only additions for the stage W3 and stage 5 checks (rust/services/analysis/tests/test_container.py). Never part of
# a deployment. Layer it over the production file, which already holds the analysis services (stage 8a moved them there):
#
#   export PRIVOKE_PKI_DIR=<directory laid out as described in docker-compose.prod.yml>
#   docker compose -f docker-compose.prod.yml -f docker-compose.analysis-test.yml --profile legacy-analysis up -d
#
# Two things differ from the production stack, and both are the test's to supply:
#
# * The host cannot reach a container whose only networks are `internal: true`. `analysis-test-gateway` copies TCP
#   bytes from two loopback ports to the analysis service and the model service. TLS stays end to end between the host
#   client and the target, and the gateway holds no credential. The analysis service itself still has no route out and no
#   published port.
# * The V1 fuzzer and the V1 update-service training cycle are no longer part of the stack (stage V3-R7: routine training is V3
#   only), so the checks of `test_container.py` that drive a V1 training cycle through the analysis service have no stack to
#   run against; they are retired with the V1 training code (stage V3-R8).
#
# The gateway script is plain Python from tests/support, mounted read-only into a stock interpreter image.

x-support: &support
  type: bind
  source: ./rust/services/analysis/tests/support
  target: /support
  read_only: true

services:
  analysis-test-gateway:
    profiles: [legacy-analysis]
    image: ${PRIVOKE_SUPPORT_IMAGE:-python:3.11-slim-bookworm}
    container_name: analysis-test-gateway
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    command: [python, /support/tcp_gateway.py, "50754=analysis-service:50054", "50752=analysis-model-streaming:50051"]
    ports:
      - "127.0.0.1:${PRIVOKE_W3_ANALYSIS_PORT:-50754}:50754"
      - "127.0.0.1:${PRIVOKE_W3_MODEL_PORT:-50752}:50752"
    networks: [default, analysis-fuzzer, analysis-models]
    volumes:
      - *support
